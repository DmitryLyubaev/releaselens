services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: releaselens-postgres
    environment:
      POSTGRES_USER: releaselens
      POSTGRES_PASSWORD: releaselens_dev_only
      POSTGRES_DB: releaselens
    ports:
      # 0.0.0.0 inside the WSL2 VM, deliberately. WSL2's localhost relay only forwards
      # services listening on 0.0.0.0, so binding 127.0.0.1 here makes the database
      # unreachable from Windows, where dotnet runs. It is not LAN-exposed either way:
      # under WSL2 NAT the VM's own IP is not reachable from the host, only the relay is.
      - "5433:5432"
    volumes:
      - releaselens-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releaselens -d releaselens"]
      interval: 5s
      timeout: 5s
      retries: 10

  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    container_name: releaselens-aspire
    environment:
      DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS: "true"
    ports:
      # Same WSL2 relay constraint as Postgres above. The dashboard runs
      # unsecured-anonymous, which is acceptable only because WSL2 NAT keeps it off the LAN.
      - "18888:18888"   # UI
      - "4317:18889"    # OTLP gRPC

  api:
    build:
      context: .
      dockerfile: src/ReleaseLens.Api/Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      RELEASELENS_DB: "Host=postgres;Port=5432;Database=releaselens;Username=releaselens;Password=releaselens_dev_only"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
      OPENAI_API_KEY: "${OPENAI_API_KEY}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://aspire-dashboard:18889"
    ports:
      - "8080:8080"

  eval:
    build:
      context: ./eval
    profiles: ["eval"]   # Not started by default — a local harness, never deployed.
    environment:
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
    volumes:
      - ./eval/reports:/app/reports
      - ./eval/golden:/app/golden:ro
    ports:
      # Same WSL2 relay constraint as the other services here.
      - "8000:8000"

volumes:
  releaselens-pgdata:
