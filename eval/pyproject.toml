[project]
name = "releaselens-eval"
version = "1.0.0"
description = "Evaluation harness for ReleaseLens. Runs locally; never deployed."
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
