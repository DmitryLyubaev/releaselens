name: Destroy

# Dispatched by hand, and nightly at 14:00 UTC (midnight AEST). The schedule is a best-effort
# safety net, not a guarantee: GitHub disables scheduled workflows in a public repository after
# 60 days without activity, and can delay or drop scheduled runs. There is no confirmation step,
# because destroy is the direction that stops billing.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

permissions: {}

# Shared with deploy.yml, so that a nightly destroy queues behind a deploy instead of being
# cancelled by it.
concurrency:
  group: releaselens-azure
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  destroy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # The scheduled run needs the environment too: the federated credential trusts only it.
    environment: azure
    permissions:
      id-token: write
      contents: read
    # TF_VAR_image is left out: destroy deploys no image, so the placeholder default applies.
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      TF_VAR_app_identity_id: ${{ vars.APP_IDENTITY_ID }}
      TF_VAR_app_identity_client_id: ${{ vars.APP_IDENTITY_CLIENT_ID }}
      TF_VAR_azure_openai_deployment: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
      # Identifiers, not credentials. They are environment secrets so that GitHub masks each value
      # wherever it appears whole in this public log, including inside resource IDs such as
      # APP_IDENTITY_ID. A fragment, such as the base URL's host alone, is not masked, so
      # Terraform's apply and destroy output passes through a filter that hides the subscription
      # ID even when Terraform truncates it. The storage account's name can lead to the tenant ID,
      # and the base URL gives that name away (spec §4.12).
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_azure_openai_base_url: ${{ secrets.AZURE_OPENAI_BASE_URL }}
      TFSTATE_STORAGE_ACCOUNT: ${{ secrets.TFSTATE_STORAGE_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Destroy the app stack
        working-directory: infra/terraform
        run: |
          # Terraform shortens long resource IDs in its progress lines, and GitHub does not mask a
          # subscription ID cut short. So both of Terraform's streams pass through this filter. Its
          # second expression hides a GUID's end, which a short ID can keep after the `...`.
          redact() { sed -u -E 's#/subscriptions/[0-9a-fA-F-]+#/subscriptions/<redacted>#g; s#\.\.\.[0-9a-fA-F-]+/#...<redacted>/#g'; }
          terraform init -input=false -backend-config=storage_account_name="$TFSTATE_STORAGE_ACCOUNT"

          # azurerm issue #33433: deleting a Container App or its environment succeeds in Azure,
          # but Terraform then stops on a polling error. The next run drops the deleted resource
          # from state, so that error alone is retried, in up to three attempts: one for each of
          # the two resources, then a clean pass. Any other failure ends the step at once.
          # shell: bash runs with pipefail, so the loop sees terraform's failure, not the filter's
          # success. The log is unfiltered, and stays on the runner, which is discarded.
          log="$RUNNER_TEMP/terraform-destroy.log"
          attempt=1
          until terraform destroy -auto-approve -input=false -lock-timeout=10m 2>&1 | tee "$log" | redact; do
            if [ "$attempt" -ge 3 ] || ! grep -qF 'polling support for the Content-Type "" was not implemented' "$log"; then
              exit 1
            fi
            attempt=$((attempt + 1))
            echo "::warning::The destroy failed on azurerm issue #33433, whose deletes succeed in Azure. Retrying: attempt $attempt of 3."
          done

      # A resource created outside Terraform survives a destroy. This lists the group and fails,
      # naming each resource, if anything is left. It only reads, so it runs even after a failed or
      # cancelled destroy, and names what is still billing.
      - name: Fail if anything is left in rg-releaselens
        if: ${{ always() }}
        run: >-
          python3 scripts/deploy_tools.py check-empty
          --subscription "$ARM_SUBSCRIPTION_ID"
          --resource-group rg-releaselens
          --client-id "$ARM_CLIENT_ID"
          --tenant-id "$ARM_TENANT_ID"
