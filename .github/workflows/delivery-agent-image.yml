name: Delivery agent image

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: build/delivery-agents/Dockerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: p8-agent:test
      - name: Smoke the pinned toolchain and one-shot lifecycle
        run: bash build/delivery-agents/smoke.sh p8-agent:test

  publish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - id: image-name
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "name=ghcr.io/${OWNER,,}/releaselens-agent" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: .
          file: build/delivery-agents/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ steps.image-name.outputs.name }}:p8-sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Smoke the exact image before publication
        env:
          IMAGE: ${{ steps.image-name.outputs.name }}
          SOURCE: ${{ github.sha }}
        run: bash build/delivery-agents/smoke.sh "$IMAGE:p8-sha-$SOURCE"
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish reviewed delivery image
        env:
          IMAGE: ${{ steps.image-name.outputs.name }}
          SOURCE: ${{ github.sha }}
        run: |
          docker push "$IMAGE:p8-sha-$SOURCE"
          docker image inspect "$IMAGE:p8-sha-$SOURCE" --format '{{range .RepoDigests}}{{println .}}{{end}}' >> "$GITHUB_STEP_SUMMARY"
          docker image inspect "$IMAGE:p8-sha-$SOURCE" | python build/delivery-agents/toolchain_receipt.py --binding
