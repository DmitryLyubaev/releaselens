# Fixed authentication-only task; no deployment, storage or query commands.
parameters:
- name: role
  type: string
  values: [test, prod, verify]
steps:
- task: AzureCLI@2
  displayName: Check actual ${{ parameters.role }} identity and OIDC refresh
  condition: and(succeededOrFailed(), eq(variables['P8IdentityPreflightReady'], 'true'))
  inputs:
    ${{ if eq(parameters.role, 'test') }}:
      azureSubscription: ReleaseLens-P8-Test
    ${{ if eq(parameters.role, 'prod') }}:
      azureSubscription: ReleaseLens-P8-Prod
    ${{ if eq(parameters.role, 'verify') }}:
      azureSubscription: ReleaseLens-P8-Verify
    scriptType: bash
    scriptLocation: inlineScript
    addSpnToEnvironment: true
    visibleAzLogin: false
    keepAzSessionActive: true
    inlineScript: |
      set -euo pipefail
      "$(Agent.TempDirectory)/p8-workload/bin/python" -m scripts.pipelines.identity_preflight ${{ parameters.role }} --receipt-dir "$(Agent.TempDirectory)/p8-identity-preflight"
    workingDirectory: $(Build.SourcesDirectory)
  env:
    PYTHONPATH: $(Build.SourcesDirectory):$(Build.SourcesDirectory)/eval
    BUILD_REASON: $(Build.Reason)
    BUILD_SOURCEBRANCH: $(Build.SourceBranch)
    BUILD_SOURCEVERSION: $(Build.SourceVersion)
    BUILD_BUILDID: $(Build.BuildId)
    P8_TENANT_ID: $(P8_TENANT_ID)
    P8_SUBSCRIPTION_ID: $(P8_SUBSCRIPTION_ID)
    P8_STORAGE_ACCOUNT: $(P8_STORAGE_ACCOUNT)
    P8_SEARCH_GROUP: $(P8_SEARCH_GROUP)
    P8_SEARCH_SERVICE: $(P8_SEARCH_SERVICE)
    P8_RELEASE_DIGEST: $(P8_RELEASE_DIGEST)
    P8_PRINCIPALS_JSON: $(P8_PRINCIPALS_JSON)
    SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
