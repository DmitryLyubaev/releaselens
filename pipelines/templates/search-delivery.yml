# Required extends template. No untrusted step or script parameters.
parameters:
- name: mode
  type: string
  values:
  - release
  - negative
  - identity-preflight
stages:
- ${{ if eq(variables['Build.Reason'], 'Schedule') }}:
  - stage: ScheduledReadOnly
    jobs:
    - job: VerifyOnly
      timeoutInMinutes: 6
      cancelTimeoutInMinutes: 1
      pool:
        name: ReleaseLens-P7
        demands:
        - P8Agent -equals ReleaseLens
      steps:
      - checkout: self
        clean: true
        persistCredentials: false
      - bash: 'set -euo pipefail

          test "$BUILD_SOURCEBRANCH" = refs/heads/main

          test "$BUILD_SOURCEVERSION" = "$P8_SOURCE_SHA"

          /opt/p8-workload/bin/python -m scripts.pipelines.run verify --authority "$(Agent.TempDirectory)/p8-authority.json" --receipt-dir "$(Agent.TempDirectory)/p8-publish"
          --guard-only'
        displayName: Guard exact main source before Azure login
        env:
          PYTHONPATH: $(Build.SourcesDirectory):$(Build.SourcesDirectory)/eval
          P8_AUTHORITY_JSON: $(P8_AUTHORITY_JSON)
          P8_AUTHORITY_SHA256: $(P8_AUTHORITY_SHA256)
          P8_SOURCE_SHA: $(P8_SOURCE_SHA)
      - task: AzureCLI@2
        displayName: Search delivery verify
        inputs:
          azureSubscription: ReleaseLens-P8-Verify
          scriptType: bash
          scriptLocation: inlineScript
          addSpnToEnvironment: true
          visibleAzLogin: false
          keepAzSessionActive: true
          inlineScript: 'set -euo pipefail

            /opt/p8-workload/bin/python -m scripts.pipelines.run verify --authority "$(Agent.TempDirectory)/p8-authority.json" --receipt-dir "$(Agent.TempDirectory)/p8-publish"'
          workingDirectory: $(Build.SourcesDirectory)
        env:
          PYTHONPATH: $(Build.SourcesDirectory):$(Build.SourcesDirectory)/eval
          P8_AUTHORITY_JSON: $(P8_AUTHORITY_JSON)
          P8_AUTHORITY_SHA256: $(P8_AUTHORITY_SHA256)
          P8_SOURCE_SHA: $(P8_SOURCE_SHA)
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)
          SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
      - task: PublishTestResults@2
        condition: always()
        inputs:
          testResultsFormat: JUnit
          testResultsFiles: $(Agent.TempDirectory)/p8-publish/**/*.xml
          failTaskOnFailedTests: true
          failTaskOnMissingResultsFile: true
          testRunTitle: P8 verify
      - task: PublishPipelineArtifact@1
        condition: always()
        inputs:
          targetPath: $(Agent.TempDirectory)/p8-publish
          artifact: p8-verify
- ${{ if ne(variables['Build.Reason'], 'Schedule') }}:
  - ${{ if eq(parameters.mode, 'identity-preflight') }}:
    - stage: IdentityPreflight
      jobs:
      - job: IdentityPreflight
        timeoutInMinutes: 20
        cancelTimeoutInMinutes: 1
        pool:
          vmImage: ubuntu-24.04
        steps:
        - checkout: self
          clean: true
          persistCredentials: false
        - task: UsePythonVersion@0
          inputs:
            versionSpec: '3.12'
            addToPath: true
        - bash: |
            set -euo pipefail
            test "$BUILD_SOURCEBRANCH" = refs/heads/main
            test "$BUILD_SOURCEVERSION" = "$P8_PREFLIGHT_SOURCE_SHA"
            python -m venv "$(Agent.TempDirectory)/p8-preflight-cli"
            "$(Agent.TempDirectory)/p8-preflight-cli/bin/pip" install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r build/delivery-agents/cli-requirements.lock
            python -m venv "$(Agent.TempDirectory)/p8-preflight-workload"
            "$(Agent.TempDirectory)/p8-preflight-workload/bin/pip" install --disable-pip-version-check --require-hashes --only-binary=:all: --no-deps -r build/delivery-agents/requirements.lock
            mkdir -p "$(Agent.TempDirectory)/p8-identity-preflight"
            "$(Agent.TempDirectory)/p8-preflight-workload/bin/python" -m scripts.pipelines.identity_preflight all --guard-only --receipt-dir "$(Agent.TempDirectory)/p8-identity-preflight"
            echo "##vso[task.prependpath]$(Agent.TempDirectory)/p8-preflight-cli/bin"
            echo "##vso[task.setvariable variable=P8IdentityPreflightReady]true"
          displayName: Install pinned tools and guard diagnostic source before login
          workingDirectory: $(Build.SourcesDirectory)
          env:
            PYTHONPATH: $(Build.SourcesDirectory):$(Build.SourcesDirectory)/eval
            P8_PREFLIGHT_JSON: $(P8_PREFLIGHT_JSON)
            P8_PREFLIGHT_SHA256: $(P8_PREFLIGHT_SHA256)
            P8_PREFLIGHT_SOURCE_SHA: $(P8_PREFLIGHT_SOURCE_SHA)
        - template: identity-preflight-task.yml
          parameters:
            role: test
        - template: identity-preflight-task.yml
          parameters:
            role: prod
        - template: identity-preflight-task.yml
          parameters:
            role: verify
        - bash: |
            set -euo pipefail
            "$(Agent.TempDirectory)/p8-preflight-workload/bin/python" -m scripts.pipelines.identity_preflight all --receipt-dir "$(Agent.TempDirectory)/p8-identity-preflight"
          displayName: Require three actual successful identity and refresh proofs
          condition: and(succeededOrFailed(), eq(variables['P8IdentityPreflightReady'], 'true'))
          env:
            PYTHONPATH: $(Build.SourcesDirectory):$(Build.SourcesDirectory)/eval
            P8_PREFLIGHT_JSON: $(P8_PREFLIGHT_JSON)
            P8_PREFLIGHT_SHA256: $(P8_PREFLIGHT_SHA256)
            P8_PREFLIGHT_SOURCE_SHA: $(P8_PREFLIGHT_SOURCE_SHA)
        - task: PublishPipelineArtifact@1
          condition: always()
          inputs:
            targetPath: $(Agent.TempDirectory)/p8-identity-preflight
            artifact: p8-identity-preflight
  - ${{ if eq(parameters.mode, 'release') }}:
    - stage: BuildAndTestPlan
      jobs:
      - job: BuildAndTestPlan
        timeoutInMinutes: 6
        cancelTimeoutInMinutes: 1
        pool:
          name: ReleaseLens-P7
          demands:
          - P8Agent -equals ReleaseLens
        steps:
        - checkout: self
          clean: true
          persistCredentials: false
        - bash: 'set -euo pipefail

            test "$BUILD_SOURCEBRANCH" = refs/heads/main

            test "$BUILD_SOURCEVERSION" = "$P8_SOURCE_SHA"

            /opt/p8-workload/bin/python -m scripts.pipelines.run build --authority "$(Agent.TempDirectory)/p8-authority.json" --receipt-dir "$(Agent.TempDirectory)/p8-publish"
            --guard-only'
          displayName: Guard exact main source before Azure login
          env:
            PYTHONPATH: $(Build.SourcesDirectory):$(Build.SourcesDirectory)/eval
            P8_AUTHORITY_JSON: $(P8_AUTHORITY_JSON)
            P8_AUTHORITY_SHA256: $(P8_AUTHORITY_SHA256)
            P8_SOURCE_SHA: $(P8_SOURCE_SHA)
        - task: AzureCLI@2
          displayName: Search delivery build
          inputs:
            azureSubscription: ReleaseLens-P8-Test
            scriptType: bash
            scriptLocation: inlineScript
            addSpnToEnvironment: true
            visibleAzLogin: false
            keepAzSessionActive: true
            inlineScript: 'set -euo pipefail

              /opt/p8-workload/bin/python -m scripts.pipelines.run build --authority "$(Agent.TempDirectory)/p8-authority.json" --receipt-dir
              "$(Agent.TempDirectory)/p8-publish"'
            workingDirectory: $(Build.SourcesDirectory)
          env:
            PYTHONPATH: $(Build.SourcesDirectory):$(Build.SourcesDirectory)/eval
            P8_AUTHORITY_JSON: $(P8_AUTHORITY_JSON)
            P8_AUTHORITY_SHA256: $(P8_AUTHORITY_SHA256)
            P8_SOURCE_SHA: $(P8_SOURCE_SHA)
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
        - task: PublishTestResults@2
          condition: always()
          inputs:
            testResultsFormat: JUnit
            testResultsFiles: $(Agent.TempDirectory)/p8-publish/**/*.xml
            failTaskOnFailedTests: true
            failTaskOnMissingResultsFile: true
            testRunTitle: P8 build
        - task: PublishPipelineArtifact@1
          condition: always()
          inputs:
            targetPath: $(Agent.TempDirectory)/p8-publish
            artifact: p8-build
    - stage: ApplyTestAndGate
      dependsOn: BuildAndTestPlan
      condition: succeeded()
      jobs:
      - deployment: ApplyTestGateAndProdPlan
        timeoutInMinutes: 13
        cancelTimeoutInMinutes: 1
        pool:
          name: ReleaseLens-P7
          demands:
          - P8Agent -equals ReleaseLens
        environment: ReleaseLens-P8-Test
        strategy:
          runOnce:
            deploy:
              steps:
              - download: none
              - checkout: self
                clean: true
                persistCredentials: false
              - bash: 'set -euo pipefail

                  test "$BUILD_SOURCEBRANCH" = refs/heads/main

                  test "$BUILD_SOURCEVERSION" = "$P8_SOURCE_SHA"

                  /opt/p8-workload/bin/python -m scripts.pipelines.run test --authority "$(Agent.TempDirectory)/p8-authority.json" --receipt-dir
                  "$(Agent.TempDirectory)/p8-publish" --guard-only'
                displayName: Guard exact main source before Azure login
                env:
                  PYTHONPATH: $(Build.SourcesDirectory):$(Build.SourcesDirectory)/eval
                  P8_AUTHORITY_JSON: $(P8_AUTHORITY_JSON)
                  P8_AUTHORITY_SHA256: $(P8_AUTHORITY_SHA256)
                  P8_SOURCE_SHA: $(P8_SOURCE_SHA)
              - task: AzureCLI@2
                displayName: Search delivery test
                inputs:
                  azureSubscription: ReleaseLens-P8-Test
                  scriptType: bash
                  scriptLocation: inlineScript
                  addSpnToEnvironment: true
                  visibleAzLogin: false
                  keepAzSessionActive: true
                  inlineScript: 'set -euo pipefail

                    /opt/p8-workload/bin/python -m scripts.pipelines.run test --authority "$(Agent.TempDirectory)/p8-authority.json" --receipt-dir
                    "$(Agent.TempDirectory)/p8-publish"'
                  workingDirectory: $(Build.SourcesDirectory)
                env:
                  PYTHONPATH: $(Build.SourcesDirectory):$(Build.SourcesDirectory)/eval
                  P8_AUTHORITY_JSON: $(P8_AUTHORITY_JSON)
                  P8_AUTHORITY_SHA256: $(P8_AUTHORITY_SHA256)
                  P8_SOURCE_SHA: $(P8_SOURCE_SHA)
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                  SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
              - task: PublishTestResults@2
                condition: always()
                inputs:
                  testResultsFormat: JUnit
                  testResultsFiles: $(Agent.TempDirectory)/p8-publish/**/*.xml
                  failTaskOnFailedTests: true
                  failTaskOnMissingResultsFile: true
                  testRunTitle: P8 test
              - task: PublishPipelineArtifact@1
                condition: always()
                inputs:
                  targetPath: $(Agent.TempDirectory)/p8-publish
                  artifact: p8-test
    - stage: PlanProd
      dependsOn: ApplyTestAndGate
      condition: succeeded()
      jobs:
      - job: PlanProd
        timeoutInMinutes: 6
        cancelTimeoutInMinutes: 1
        pool:
          name: ReleaseLens-P7
          demands:
          - P8Agent -equals ReleaseLens
        steps:
        - checkout: self
          clean: true
          persistCredentials: false
        - bash: 'set -euo pipefail

            test "$BUILD_SOURCEBRANCH" = refs/heads/main

            test "$BUILD_SOURCEVERSION" = "$P8_SOURCE_SHA"

            /opt/p8-workload/bin/python -m scripts.pipelines.run plan-prod --authority "$(Agent.TempDirectory)/p8-authority.json" --receipt-dir
            "$(Agent.TempDirectory)/p8-publish" --guard-only'
          displayName: Guard exact main source before Azure login
          env:
            PYTHONPATH: $(Build.SourcesDirectory):$(Build.SourcesDirectory)/eval
            P8_AUTHORITY_JSON: $(P8_AUTHORITY_JSON)
            P8_AUTHORITY_SHA256: $(P8_AUTHORITY_SHA256)
            P8_SOURCE_SHA: $(P8_SOURCE_SHA)
        - task: AzureCLI@2
          displayName: Plan prod using scoped Prod federation
          inputs:
            azureSubscription: ReleaseLens-P8-Prod
            scriptType: bash
            scriptLocation: inlineScript
            addSpnToEnvironment: true
            visibleAzLogin: false
            keepAzSessionActive: true
            inlineScript: 'set -euo pipefail

              /opt/p8-workload/bin/python -m scripts.pipelines.run plan-prod --authority "$(Agent.TempDirectory)/p8-authority.json" --receipt-dir
              "$(Agent.TempDirectory)/p8-publish"'
            workingDirectory: $(Build.SourcesDirectory)
          env:
            PYTHONPATH: $(Build.SourcesDirectory):$(Build.SourcesDirectory)/eval
            P8_AUTHORITY_JSON: $(P8_AUTHORITY_JSON)
            P8_AUTHORITY_SHA256: $(P8_AUTHORITY_SHA256)
            P8_SOURCE_SHA: $(P8_SOURCE_SHA)
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
        - task: PublishTestResults@2
          condition: always()
          inputs:
            testResultsFormat: JUnit
            testResultsFiles: $(Agent.TempDirectory)/p8-publish/**/*.xml
            failTaskOnFailedTests: true
            failTaskOnMissingResultsFile: true
            testRunTitle: P8 plan-prod
        - task: PublishPipelineArtifact@1
          condition: always()
          inputs:
            targetPath: $(Agent.TempDirectory)/p8-publish
            artifact: p8-plan-prod
    - stage: ApplyProdAndGate
      dependsOn: PlanProd
      condition: succeeded()
      jobs:
      - deployment: ApplyProdAndGate
        timeoutInMinutes: 12
        cancelTimeoutInMinutes: 1
        pool:
          name: ReleaseLens-P7
          demands:
          - P8Agent -equals ReleaseLens
        environment: ReleaseLens-P8-DemoProd
        strategy:
          runOnce:
            deploy:
              steps:
              - download: none
              - checkout: self
                clean: true
                persistCredentials: false
              - bash: 'set -euo pipefail

                  test "$BUILD_SOURCEBRANCH" = refs/heads/main

                  test "$BUILD_SOURCEVERSION" = "$P8_SOURCE_SHA"

                  /opt/p8-workload/bin/python -m scripts.pipelines.run prod --authority "$(Agent.TempDirectory)/p8-authority.json" --receipt-dir
                  "$(Agent.TempDirectory)/p8-publish" --guard-only'
                displayName: Guard exact main source before Azure login
                env:
                  PYTHONPATH: $(Build.SourcesDirectory):$(Build.SourcesDirectory)/eval
                  P8_AUTHORITY_JSON: $(P8_AUTHORITY_JSON)
                  P8_AUTHORITY_SHA256: $(P8_AUTHORITY_SHA256)
                  P8_SOURCE_SHA: $(P8_SOURCE_SHA)
              - task: AzureCLI@2
                displayName: Search delivery prod
                inputs:
                  azureSubscription: ReleaseLens-P8-Prod
                  scriptType: bash
                  scriptLocation: inlineScript
                  addSpnToEnvironment: true
                  visibleAzLogin: false
                  keepAzSessionActive: true
                  inlineScript: 'set -euo pipefail

                    /opt/p8-workload/bin/python -m scripts.pipelines.run prod --authority "$(Agent.TempDirectory)/p8-authority.json" --receipt-dir
                    "$(Agent.TempDirectory)/p8-publish"'
                  workingDirectory: $(Build.SourcesDirectory)
                env:
                  PYTHONPATH: $(Build.SourcesDirectory):$(Build.SourcesDirectory)/eval
                  P8_AUTHORITY_JSON: $(P8_AUTHORITY_JSON)
                  P8_AUTHORITY_SHA256: $(P8_AUTHORITY_SHA256)
                  P8_SOURCE_SHA: $(P8_SOURCE_SHA)
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                  SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
              - task: PublishTestResults@2
                condition: always()
                inputs:
                  testResultsFormat: JUnit
                  testResultsFiles: $(Agent.TempDirectory)/p8-publish/**/*.xml
                  failTaskOnFailedTests: true
                  failTaskOnMissingResultsFile: true
                  testRunTitle: P8 prod
              - task: PublishPipelineArtifact@1
                condition: always()
                inputs:
                  targetPath: $(Agent.TempDirectory)/p8-publish
                  artifact: p8-prod
  - ${{ if eq(parameters.mode, 'negative') }}:
    - stage: BlockedQuality
      jobs:
      - deployment: ExpectedQualityFailure
        timeoutInMinutes: 6
        cancelTimeoutInMinutes: 1
        pool:
          name: ReleaseLens-P7
          demands:
          - P8Agent -equals ReleaseLens
        environment: ReleaseLens-P8-Test
        strategy:
          runOnce:
            deploy:
              steps:
              - download: none
              - checkout: self
                clean: true
                persistCredentials: false
              - bash: 'set -euo pipefail

                  test "$BUILD_SOURCEBRANCH" = refs/heads/main

                  test "$BUILD_SOURCEVERSION" = "$P8_SOURCE_SHA"

                  /opt/p8-workload/bin/python -m scripts.pipelines.run negative --authority "$(Agent.TempDirectory)/p8-authority.json" --receipt-dir
                  "$(Agent.TempDirectory)/p8-publish" --guard-only'
                displayName: Guard exact main source before Azure login
                env:
                  PYTHONPATH: $(Build.SourcesDirectory):$(Build.SourcesDirectory)/eval
                  P8_AUTHORITY_JSON: $(P8_AUTHORITY_JSON)
                  P8_AUTHORITY_SHA256: $(P8_AUTHORITY_SHA256)
                  P8_SOURCE_SHA: $(P8_SOURCE_SHA)
              - task: AzureCLI@2
                displayName: Search delivery negative
                inputs:
                  azureSubscription: ReleaseLens-P8-Test
                  scriptType: bash
                  scriptLocation: inlineScript
                  addSpnToEnvironment: true
                  visibleAzLogin: false
                  keepAzSessionActive: true
                  inlineScript: 'set -euo pipefail

                    /opt/p8-workload/bin/python -m scripts.pipelines.run negative --authority "$(Agent.TempDirectory)/p8-authority.json" --receipt-dir
                    "$(Agent.TempDirectory)/p8-publish"'
                  workingDirectory: $(Build.SourcesDirectory)
                env:
                  PYTHONPATH: $(Build.SourcesDirectory):$(Build.SourcesDirectory)/eval
                  P8_AUTHORITY_JSON: $(P8_AUTHORITY_JSON)
                  P8_AUTHORITY_SHA256: $(P8_AUTHORITY_SHA256)
                  P8_SOURCE_SHA: $(P8_SOURCE_SHA)
                  SYSTEM_ACCESSTOKEN: $(System.AccessToken)
                  SYSTEM_OIDCREQUESTURI: $(System.OidcRequestUri)
              - task: PublishTestResults@2
                condition: always()
                inputs:
                  testResultsFormat: JUnit
                  testResultsFiles: $(Agent.TempDirectory)/p8-publish/**/*.xml
                  failTaskOnFailedTests: true
                  failTaskOnMissingResultsFile: true
                  testRunTitle: P8 negative
              - task: PublishPipelineArtifact@1
                condition: always()
                inputs:
                  targetPath: $(Agent.TempDirectory)/p8-publish
                  artifact: p8-negative
