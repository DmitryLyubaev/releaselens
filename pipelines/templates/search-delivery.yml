# Required extends template. Fixed stages only; no untrusted step or script parameters.
# Every job is a Microsoft-hosted ubuntu-24.04 job. The scheduled run reads the service's status, then
# verifies prod, then tears down, each only when the status output is 'ready'.
parameters:
- name: mode
  type: string
  values:
  - release
  - negative
  - teardown
  - identity-preflight
stages:
- ${{ if eq(variables['Build.Reason'], 'Schedule') }}:
  - stage: Status
    jobs:
    - job: Status
      timeoutInMinutes: 5
      cancelTimeoutInMinutes: 1
      pool:
        vmImage: ubuntu-24.04
      steps:
      - template: stage-steps.yml
        parameters:
          connection: ReleaseLens-P8-Verify
          module: service
          command: status
          displayName: Is a complete release deployed
          artifact: p8-status
          junit: false
          stepName: StatusCheck
  - stage: Verify
    dependsOn: Status
    condition: and(succeeded(), eq(dependencies.Status.outputs['Status.StatusCheck.P8Status'], 'ready'))
    jobs:
    - job: Verify
      timeoutInMinutes: 8
      cancelTimeoutInMinutes: 1
      pool:
        vmImage: ubuntu-24.04
      steps:
      - template: stage-steps.yml
        parameters:
          connection: ReleaseLens-P8-Verify
          module: run
          command: verify
          displayName: Search delivery verify
          artifact: p8-verify
  - stage: TeardownProd
    dependsOn: [Status, Verify]
    condition: and(always(), in(dependencies.Status.result, 'Succeeded', 'SucceededWithIssues'), eq(dependencies.Status.outputs['Status.StatusCheck.P8Status'], 'ready'))
    jobs:
    - job: TeardownProd
      timeoutInMinutes: 10
      cancelTimeoutInMinutes: 1
      pool:
        vmImage: ubuntu-24.04
      steps:
      - template: stage-steps.yml
        parameters:
          connection: ReleaseLens-P8-Prod
          module: service
          command: teardown-prod
          displayName: Tear down the demo-prod index
          artifact: p8-teardown-prod
          junit: false
  - stage: TeardownTest
    dependsOn: [Status, TeardownProd]
    condition: and(always(), in(dependencies.Status.result, 'Succeeded', 'SucceededWithIssues'), eq(dependencies.Status.outputs['Status.StatusCheck.P8Status'], 'ready'))
    jobs:
    - job: TeardownTest
      timeoutInMinutes: 20
      cancelTimeoutInMinutes: 1
      pool:
        vmImage: ubuntu-24.04
      steps:
      - template: stage-steps.yml
        parameters:
          connection: ReleaseLens-P8-Test
          module: service
          command: teardown-test
          displayName: Tear down the test index and the search service
          artifact: p8-teardown-test
          junit: false
- ${{ if ne(variables['Build.Reason'], 'Schedule') }}:
  - ${{ if eq(parameters.mode, 'release') }}:
    - stage: BuildAndTest
      jobs:
      - job: BuildAndTest
        timeoutInMinutes: 10
        cancelTimeoutInMinutes: 1
        pool:
          vmImage: ubuntu-24.04
        steps:
        - template: stage-steps.yml
          parameters:
            connection: ReleaseLens-P8-Test
            module: run
            command: build
            displayName: Search delivery build and offline tests
            artifact: p8-build
    - stage: CreateService
      dependsOn: BuildAndTest
      jobs:
      - job: CreateService
        timeoutInMinutes: 12
        cancelTimeoutInMinutes: 1
        pool:
          vmImage: ubuntu-24.04
        steps:
        - template: stage-steps.yml
          parameters:
            connection: ReleaseLens-P8-Test
            module: service
            command: create-service
            displayName: Create the search service
            artifact: p8-create-service
            junit: false
    - stage: PlanTest
      dependsOn: CreateService
      jobs:
      - job: PlanTest
        timeoutInMinutes: 6
        cancelTimeoutInMinutes: 1
        pool:
          vmImage: ubuntu-24.04
        steps:
        - template: stage-steps.yml
          parameters:
            connection: ReleaseLens-P8-Test
            module: run
            command: plan-test
            displayName: Plan the test index
            artifact: p8-plan-test
    - stage: TestIndex
      dependsOn: PlanTest
      jobs:
      - deployment: TestIndex
        timeoutInMinutes: 12
        cancelTimeoutInMinutes: 1
        pool:
          vmImage: ubuntu-24.04
        environment: ReleaseLens-P8-Test
        strategy:
          runOnce:
            deploy:
              steps:
              - download: none
              - template: stage-steps.yml
                parameters:
                  connection: ReleaseLens-P8-Test
                  module: run
                  command: test
                  displayName: Apply, load and gate the test index
                  artifact: p8-test
    - stage: PlanProd
      dependsOn: TestIndex
      jobs:
      - job: PlanProd
        timeoutInMinutes: 6
        cancelTimeoutInMinutes: 1
        pool:
          vmImage: ubuntu-24.04
        steps:
        - template: stage-steps.yml
          parameters:
            connection: ReleaseLens-P8-Prod
            module: run
            command: plan-prod
            displayName: Plan the demo-prod index
            artifact: p8-plan-prod
    - stage: ProdIndex
      dependsOn: PlanProd
      jobs:
      - deployment: ProdIndex
        timeoutInMinutes: 12
        cancelTimeoutInMinutes: 1
        pool:
          vmImage: ubuntu-24.04
        environment: ReleaseLens-P8-DemoProd
        strategy:
          runOnce:
            deploy:
              steps:
              - download: none
              - template: stage-steps.yml
                parameters:
                  connection: ReleaseLens-P8-Prod
                  module: run
                  command: prod
                  displayName: Apply, load and gate the demo-prod index
                  artifact: p8-prod
  - ${{ if eq(parameters.mode, 'negative') }}:
    - stage: NegativeGate
      jobs:
      - deployment: NegativeGate
        timeoutInMinutes: 10
        cancelTimeoutInMinutes: 1
        pool:
          vmImage: ubuntu-24.04
        environment: ReleaseLens-P8-Test
        strategy:
          runOnce:
            deploy:
              steps:
              - download: none
              - template: stage-steps.yml
                parameters:
                  connection: ReleaseLens-P8-Test
                  module: run
                  command: negative
                  displayName: Negative candidate must fail the gate
                  artifact: p8-negative
    - stage: PromoteNegative
      dependsOn: NegativeGate
      jobs:
      - job: PromoteNegative
        timeoutInMinutes: 5
        cancelTimeoutInMinutes: 1
        pool:
          vmImage: ubuntu-24.04
        steps:
        - template: stage-steps.yml
          parameters:
            connection: ReleaseLens-P8-Prod
            module: run
            command: promote-negative
            displayName: A negative candidate is never promoted
            artifact: p8-promote-negative
            junit: false
  - ${{ if eq(parameters.mode, 'teardown') }}:
    - stage: TeardownProd
      jobs:
      - job: TeardownProd
        timeoutInMinutes: 10
        cancelTimeoutInMinutes: 1
        pool:
          vmImage: ubuntu-24.04
        steps:
        - template: stage-steps.yml
          parameters:
            connection: ReleaseLens-P8-Prod
            module: service
            command: teardown-prod
            displayName: Tear down the demo-prod index
            artifact: p8-teardown-prod
            junit: false
    - stage: TeardownTest
      dependsOn: TeardownProd
      condition: always()
      jobs:
      - job: TeardownTest
        timeoutInMinutes: 20
        cancelTimeoutInMinutes: 1
        pool:
          vmImage: ubuntu-24.04
        steps:
        - template: stage-steps.yml
          parameters:
            connection: ReleaseLens-P8-Test
            module: service
            command: teardown-test
            displayName: Tear down the test index and the search service
            artifact: p8-teardown-test
            junit: false
  - ${{ if eq(parameters.mode, 'identity-preflight') }}:
    - stage: IdentityPreflight
      jobs:
      - job: IdentityPreflight
        timeoutInMinutes: 10
        cancelTimeoutInMinutes: 1
        pool:
          vmImage: ubuntu-24.04
        steps:
        - template: setup-steps.yml
        - bash: |
            set -euo pipefail
            mkdir -p "$(Agent.TempDirectory)/p8-identity-preflight"
            "$(Agent.TempDirectory)/p8-workload/bin/python" -m scripts.pipelines.identity_preflight all --guard-only --receipt-dir "$(Agent.TempDirectory)/p8-identity-preflight"
            echo "##vso[task.setvariable variable=P8IdentityPreflightReady]true"
          displayName: Guard main and the settings before login
          workingDirectory: $(Build.SourcesDirectory)
          env:
            PYTHONPATH: $(Build.SourcesDirectory):$(Build.SourcesDirectory)/eval
            BUILD_REASON: $(Build.Reason)
            BUILD_SOURCEBRANCH: $(Build.SourceBranch)
            BUILD_SOURCEVERSION: $(Build.SourceVersion)
            BUILD_BUILDID: $(Build.BuildId)
            P8_TENANT_ID: $(P8_TENANT_ID)
            P8_SUBSCRIPTION_ID: $(P8_SUBSCRIPTION_ID)
            P8_STORAGE_ACCOUNT: $(P8_STORAGE_ACCOUNT)
            P8_SEARCH_GROUP: $(P8_SEARCH_GROUP)
            P8_SEARCH_SERVICE: $(P8_SEARCH_SERVICE)
            P8_RELEASE_DIGEST: $(P8_RELEASE_DIGEST)
            P8_PRINCIPALS_JSON: $(P8_PRINCIPALS_JSON)
        - template: identity-preflight-task.yml
          parameters:
            role: test
        - template: identity-preflight-task.yml
          parameters:
            role: prod
        - template: identity-preflight-task.yml
          parameters:
            role: verify
        - bash: |
            set -euo pipefail
            "$(Agent.TempDirectory)/p8-workload/bin/python" -m scripts.pipelines.identity_preflight all --receipt-dir "$(Agent.TempDirectory)/p8-identity-preflight"
          displayName: Require three actual successful identity and refresh proofs
          condition: and(succeededOrFailed(), eq(variables['P8IdentityPreflightReady'], 'true'))
          workingDirectory: $(Build.SourcesDirectory)
          env:
            PYTHONPATH: $(Build.SourcesDirectory):$(Build.SourcesDirectory)/eval
            BUILD_REASON: $(Build.Reason)
            BUILD_SOURCEBRANCH: $(Build.SourceBranch)
            BUILD_SOURCEVERSION: $(Build.SourceVersion)
            BUILD_BUILDID: $(Build.BuildId)
            P8_TENANT_ID: $(P8_TENANT_ID)
            P8_SUBSCRIPTION_ID: $(P8_SUBSCRIPTION_ID)
            P8_STORAGE_ACCOUNT: $(P8_STORAGE_ACCOUNT)
            P8_SEARCH_GROUP: $(P8_SEARCH_GROUP)
            P8_SEARCH_SERVICE: $(P8_SEARCH_SERVICE)
            P8_RELEASE_DIGEST: $(P8_RELEASE_DIGEST)
            P8_PRINCIPALS_JSON: $(P8_PRINCIPALS_JSON)
        - task: PublishPipelineArtifact@1
          condition: always()
          inputs:
            targetPath: $(Agent.TempDirectory)/p8-identity-preflight
            artifact: p8-identity-preflight
