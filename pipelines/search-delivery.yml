# Private Project 8 pipeline only. It runs on Microsoft-hosted agents and reads plain settings from the
# private variable group; the group holds no secrets. The one genuine scheduled run took place on
# 21 October 2026 (docs/pipelines-report.md); the schedule is removed, and the template keeps the path.
trigger: none
pr: none
parameters:
  - name: mode
    type: string
    default: release
    values: [release, negative, teardown, identity-preflight]
variables:
  - group: ReleaseLens-P8-Delivery
lockBehavior: sequential
extends:
  template: templates/search-delivery.yml
  parameters:
    mode: ${{ parameters.mode }}
