# Private Project 8 pipeline only. It runs on Microsoft-hosted agents and reads plain settings from the
# private variable group; the group holds no secrets. A schedule registers from the default branch.
trigger: none
pr: none
parameters:
  - name: mode
    type: string
    default: release
    values: [release, negative, teardown, identity-preflight]
variables:
  - group: ReleaseLens-P8-Delivery
schedules:
  - cron: '0 6 * * *'
    displayName: Verify prod, then tear down
    branches:
      include: [main]
    always: true
lockBehavior: sequential
extends:
  template: templates/search-delivery.yml
  parameters:
    mode: ${{ parameters.mode }}
