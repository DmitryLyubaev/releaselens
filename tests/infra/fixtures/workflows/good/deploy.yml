name: Deploy

# Dispatched by hand only. Applying on every push would create a billing Postgres server each
# time. The environment azure admits only runs from main, and the federated credential trusts
# only that environment (spec §4.12).

on: workflow_dispatch

permissions: {}

# Shared with destroy.yml, so that a nightly destroy queues behind a deploy instead of being
# cancelled by it.
concurrency:
  group: releaselens-azure
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      # The nightly destroy is what stops the Postgres bill, so there is no deploy without it.
      - name: Refuse to deploy while the nightly destroy is disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          state=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/destroy.yml" --jq .state)
          if [ "$state" != active ]; then
            echo "::error::destroy.yml is $state, not active. Enable it, then re-run."
            exit 1
          fi

      # Pinned by digest, so the image checked here is the image that runs, and a re-apply always
      # rolls out the image it names. The package is public, so an anonymous token can read it.
      - name: Resolve the image digest
        id: image
        run: |
          repository=dmitrylyubaev/releaselens-api
          tag="sha-$GITHUB_SHA"
          token=$(curl -fsS --max-time 30 "https://ghcr.io/token?scope=repository:$repository:pull" | jq -r .token)
          echo "::add-mask::$token"
          status=$(curl -sS --max-time 30 --head -o /dev/null -D "$RUNNER_TEMP/manifest-headers" -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            -H "Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.docker.distribution.manifest.v2+json" \
            "https://ghcr.io/v2/$repository/manifests/$tag")
          if [ "$status" = 404 ]; then
            echo "::error::Image tag $tag is not in GHCR yet; wait for ci.yml's publish-image job on this commit, then re-run."
            exit 1
          fi
          if [ "$status" != 200 ]; then
            echo "::error::GHCR returned HTTP $status for $tag."
            exit 1
          fi
          digest=$(tr -d '\r' < "$RUNNER_TEMP/manifest-headers" | awk 'tolower($1) == "docker-content-digest:" { print $2 }')
          if [[ ! $digest =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::GHCR returned no sha256 digest for $tag."
            exit 1
          fi
          echo "image=ghcr.io/$repository@$digest" >> "$GITHUB_OUTPUT"
          echo "$tag is ghcr.io/$repository@$digest"

  deploy:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: azure
    permissions:
      id-token: write
      contents: read
    env:
      ARM_USE_OIDC: "true"
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      # Identifiers, not credentials. They are environment secrets so that GitHub masks them
      # everywhere in this public log, including inside resource IDs such as APP_IDENTITY_ID.
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      TF_VAR_app_identity_id: ${{ vars.APP_IDENTITY_ID }}
      TF_VAR_app_identity_client_id: ${{ vars.APP_IDENTITY_CLIENT_ID }}
      TF_VAR_azure_openai_base_url: ${{ vars.AZURE_OPENAI_BASE_URL }}
      TF_VAR_azure_openai_deployment: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}
      TF_VAR_image: ${{ needs.preflight.outputs.image }}
      TFSTATE_STORAGE_ACCOUNT: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
      DOTNET_NOLOGO: true
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Apply the app stack
        working-directory: infra/terraform
        run: |
          terraform init -input=false -backend-config=storage_account_name="$TFSTATE_STORAGE_ACCOUNT"
          terraform apply -auto-approve -input=false -lock-timeout=10m

      # Whether a GitHub-hosted runner passes Postgres's allow-azure-services rule is unverified
      # (spec §6.1). Setting SMOKE_OPEN_RUNNER_IP to true opens the server to this runner alone,
      # for the smoke test, and the last step closes it again.
      - name: Open Postgres to this runner
        id: open-runner
        if: vars.SMOKE_OPEN_RUNNER_IP == 'true'
        working-directory: infra/terraform
        run: |
          ip=$(curl -fsS --max-time 30 https://api.ipify.org)
          # Checked before it is printed or used: the response is not ours.
          if [[ ! $ip =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "::error::api.ipify.org did not return an IPv4 address."
            exit 1
          fi
          echo "Opening Postgres to $ip"
          TF_VAR_smoke_runner_ip="$ip" terraform apply -auto-approve -input=false -lock-timeout=10m

      - name: Smoke test
        env:
          RELEASELENS_Tenant__Slug: smoke
          RELEASELENS_Tenant__DisplayName: smoke
          RELEASELENS_Tenant__DailyTokenBudget: "200000"
          Logging__LogLevel__Default: Warning
        run: |
          # The runner unescapes %25, %0D and %0A in a workflow command's value, so the value is
          # escaped first. Otherwise a password containing one of them would mask the wrong string.
          mask() {
            local value=${1//"%"/%25}
            value=${value//$'\r'/%0D}
            printf '::add-mask::%s\n' "${value//$'\n'/%0A}"
          }

          # Masked before anything else runs. The password is masked on its own as well, in case
          # something prints it outside the whole string.
          db=$(terraform -chdir=infra/terraform output -raw database_connection_string)
          mask "$db"
          password=${db#*;Password=}
          mask "${password%%;*}"
          export RELEASELENS_DB="$db"

          # The deployed database has no schema and no tenant: the API runs no migrations, and
          # the Worker is not in the image.
          dotnet build src/ReleaseLens.Worker -c Release
          worker() { dotnet run --no-build -c Release --project src/ReleaseLens.Worker -- "$@"; }
          worker migrate
          worker create-tenant

          # Captured, never echoed. The key is the last non-empty line of issue-key's output, and
          # the Worker's keys are rl_ followed by hex, so a stray log line is not taken for one.
          issued=$(worker issue-key smoke smoke-test)
          key=$(printf '%s\n' "$issued" | awk 'NF { last = $0 } END { print last }')
          mask "$key"
          if [[ ! $key =~ ^rl_[0-9a-f]+$ ]]; then
            echo "::error::The last line issue-key printed is not an API key."
            exit 1
          fi
          # price needs no database, so the smoke test does not get the connection string.
          unset issued RELEASELENS_DB

          url=$(terraform -chdir=infra/terraform output -raw api_url)
          identity=$(terraform -chdir=infra/terraform output -json pricing_identity)
          SMOKE_API_KEY="$key" python3 scripts/deploy_tools.py smoke \
            --url "$url" \
            --model "$(jq -r .model <<< "$identity")" \
            --model-version "$(jq -r .model_version <<< "$identity")" \
            --deployment-type "$(jq -r .deployment_type <<< "$identity")" \
            --price-cmd "dotnet run --no-build -c Release --project src/ReleaseLens.Worker -- price"

      # Runs whenever the open step ran, whatever happened after it.
      - name: Close Postgres to this runner
        if: always() && steps.open-runner.outcome != 'skipped'
        working-directory: infra/terraform
        env:
          TF_VAR_smoke_runner_ip: ""
        run: terraform apply -auto-approve -input=false -lock-timeout=10m
