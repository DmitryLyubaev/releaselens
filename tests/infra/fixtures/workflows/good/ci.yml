name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/releaselens-api

jobs:
  # Only publish-image must be SHA-pinned, so these tags are allowed.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test --configuration Release
      - uses: actions/setup-python@0123456789abcdef0123456789abcdef01234567 # v5
        with:
          python-version: "3.13"
      - run: pip install -r tests/infra/requirements.txt
      - run: python -m pytest tests/infra -q
      - run: python scripts/check_workflows.py .github/workflows

  terraform-plan:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@0123456789abcdef0123456789abcdef01234567 # v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - run: terraform fmt -check -recursive infra

  publish-image:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@0123456789abcdef0123456789abcdef01234567 # v4
      - uses: docker/setup-buildx-action@0123456789abcdef0123456789abcdef01234567 # v3
      - uses: docker/login-action@0123456789abcdef0123456789abcdef01234567 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@0123456789abcdef0123456789abcdef01234567 # v6
        with:
          context: .
          file: src/ReleaseLens.Api/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
